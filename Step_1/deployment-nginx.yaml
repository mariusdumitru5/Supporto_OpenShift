apiVersion: apps/v1
kind: Deployment 
metadata:
  name: deployment-nginx
  namespace: ns-track4
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: nginx-ws 
  template:
    metadata:
      labels: 
        app: nginx-ws 
    spec:
      containers:
        - name: nginx
          image: nginx:alpine 
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m" 